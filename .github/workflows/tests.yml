name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils
      - run: pip install -e ".[dev,mcp,ocr]"
      - run: pytest -q
      - name: OCR nas notas escaneadas (sem LLM)
        run: python bench/ocr_eval.py
